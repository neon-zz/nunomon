
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぬのモン - 自動行動</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #171717;
  color: white;
  font-family: system-ui, sans-serif;
  padding: 20px;
}

.app {
  width: min(100%, 520px);
  text-align: center;
}

h1 { font-size: 1.5rem; margin-bottom: 5px; }
.sub { color: #bbb; margin-bottom: 20px; }

.stage {
  min-height: 390px;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, #383838, #202020 70%);
  border: 1px solid #555;
  border-radius: 22px;
  overflow: hidden;
  padding: 22px;
}

.monster {
  position: relative;
  width: min(82vw, 360px);
  aspect-ratio: 921 / 936;
  animation: float 2.6s ease-in-out infinite;
  transform-origin: 50% 80%;
}

.monster.still { animation: none; }

.part {
  position: absolute;
  height: auto;
  user-select: none;
  pointer-events: none;
}

.body { inset: 0; width: 100%; }

.eye {
  width: 25.5%;
  top: 27%;
  transform-origin: center 55%;
  animation: blink 4.8s infinite;
}

.eye.left { left: 24%; }
.eye.right { left: 55%; animation-delay: .12s; }

.mouth {
  width: 36%;
  left: 35%;
  top: 54%;
  transform-origin: center 15%;
  animation: mouthMove 3.1s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-9px) rotate(-1deg); }
}

@keyframes blink {
  0%,43%,47%,100% { transform: scaleY(1); }
  45% { transform: scaleY(.12); }
}

@keyframes mouthMove {
  0%,100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(3px) scaleY(.94); }
}

.expression-surprised .eye {
  animation-name: surprisedEyes;
}
.expression-surprised .mouth {
  animation-name: surprisedMouth;
}

@keyframes surprisedEyes {
  0%,100% { transform: scaleY(1.2); }
  45% { transform: scaleY(.8); }
}

@keyframes surprisedMouth {
  0%,100% { transform: scaleY(1.12); }
  50% { transform: scaleY(1.2); }
}

.expression-happy .eye {
  animation-name: happyEyes;
}
.expression-happy .mouth {
  animation-name: happyMouth;
}

@keyframes happyEyes {
  0%,100% { transform: scaleY(.65); }
  45% { transform: scaleY(.12); }
}

@keyframes happyMouth {
  0%,100% { transform: scaleY(1.08); }
  50% { transform: translateY(4px) scaleY(.9); }
}

.expression-sleepy .eye {
  animation-name: sleepyEyes;
}
.expression-sleepy .mouth {
  animation-name: sleepyMouth;
}

@keyframes sleepyEyes {
  0%,100% { transform: scaleY(.35); }
  50% { transform: scaleY(.25); }
}

@keyframes sleepyMouth {
  0%,100% { transform: scaleY(.8); }
  50% { transform: translateY(3px) scaleY(.7); }
}

.expression-sad .eye {
  animation-name: sadEyes;
}
.expression-sad .mouth {
  animation-name: sadMouth;
}

@keyframes sadEyes {
  0%,100% { transform: translateY(3px) scaleY(.8); }
  50% { transform: translateY(5px) scaleY(.7); }
}

@keyframes sadMouth {
  0%,100% { transform: translateY(5px) scaleY(.7); }
  50% { transform: translateY(7px) scaleY(.65); }
}

.monster.still .eye,
.monster.still .mouth {
  animation: none !important;
}

.monster.wiggling {
  animation: wiggle .65s ease-in-out;
}

@keyframes wiggle {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-7deg); }
  40% { transform: rotate(7deg); }
  60% { transform: rotate(-5deg); }
  80% { transform: rotate(4deg); }
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 11px 15px;
  font-size: .9rem;
  font-weight: 650;
  cursor: pointer;
  background: #f4e9e1;
  color: #302722;
}

button.secondary {
  background: #454545;
  color: white;
  border: 1px solid #777;
}

button.active {
  background: #d9b7ff;
  color: #30203f;
}

button:active { transform: scale(.96); }

.note {
  color: #bbb;
  font-size: .85rem;
  margin-top: 16px;
  line-height: 1.6;
}
</style>
</head>

<body>
<main class="app">

<h1>ぬのモン</h1>
<p class="sub">クリーム色の子・自動行動試作</p>

<section class="stage">
<div class="monster" id="monster">
<img class="part body" src="body.png" alt="">
<img class="part eye left" src="eye_left.png" alt="">
<img class="part eye right" src="eye_right.png" alt="">
<img class="part mouth" src="mouth.png" alt="">
</div>
</section>

<div class="controls" id="expressions">
<button class="active" data-expression="normal">😊 いつもの顔</button>
<button data-expression="surprised">😲 びっくり</button>
<button data-expression="happy">😄 にっこり</button>
<button data-expression="sleepy">😴 ねむい</button>
<button data-expression="sad">🥺 しょんぼり</button>
</div>

<div class="controls">
<button id="auto">おまかせ OFF</button>
<button id="toggle">動きを止める</button>
<button class="secondary" id="wiggle">ぷるぷる！</button>
</div>

<p class="note" id="note">好きな表情を選んでみよう！</p>

</main>

<script>
const monster = document.getElementById("monster");
const toggle = document.getElementById("toggle");
const wiggle = document.getElementById("wiggle");
const autoButton = document.getElementById("auto");
const note = document.getElementById("note");

const buttons = document.querySelectorAll("[data-expression]");

const expressions = {
  normal: {
    message: "いつもの顔だよ！"
  },
  surprised: {
    message: "びっくりした！"
  },
  happy: {
    message: "ごきげんだよ！"
  },
  sleepy: {
    message: "もう眠たいなぁ……"
  },
  sad: {
    message: "ちょっと元気がないみたい……"
  }
};

const expressionNames = Object.keys(expressions);

let currentExpression = "normal";
let autoMode = false;
let autoTimer = null;
let wiggleTimer = null;

// 表情を変更する共通処理
function changeExpression(name) {

  monster.classList.remove(
    "expression-surprised",
    "expression-happy",
    "expression-sleepy",
    "expression-sad"
  );

  if (name !== "normal") {
    monster.classList.add("expression-" + name);
  }

  currentExpression = name;

  buttons.forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.expression === name
    );
  });

  note.textContent = expressions[name].message;
}

// 手動で表情を選ぶ
buttons.forEach(button => {

  button.addEventListener("click", () => {

    stopAuto();
    changeExpression(button.dataset.expression);

  });

});

// 自動行動
function startAuto() {

  if (autoMode) return;

  autoMode = true;
  autoButton.textContent = "おまかせ ON";
  autoButton.classList.add("active");

  note.textContent = "自由気ままに遊んでいるよ！";

  scheduleAction();
}

function stopAuto() {

  autoMode = false;

  clearTimeout(autoTimer);
  clearTimeout(wiggleTimer);

  monster.classList.remove("wiggling");

  autoButton.textContent = "おまかせ OFF";
  autoButton.classList.remove("active");
}

function scheduleAction() {

  clearTimeout(autoTimer);

  if (!autoMode) return;

  // 3〜6秒後に次の行動
  const delay = 3000 + Math.random() * 3000;

  autoTimer = setTimeout(() => {

    if (!autoMode) return;

    // 5種類からランダムに選ぶ
    const randomIndex = Math.floor(
      Math.random() * expressionNames.length
    );

    const selected = expressionNames[randomIndex];

    changeExpression(selected);

    // 約25%の確率でぷるぷる
    if (Math.random() < 0.25) {
      playWiggle();
    }

    scheduleAction();

  }, delay);
}

// おまかせ切り替え
autoButton.addEventListener("click", () => {

  if (autoMode) {
    stopAuto();
    note.textContent = "おまかせを終了したよ！";
  } else {
    startAuto();
  }

});

// 動きを止める・再開する
toggle.addEventListener("click", () => {

  const stopped = monster.classList.toggle("still");

  toggle.textContent = stopped
    ? "動かす"
    : "動きを止める";

  if (stopped) {
    monster.classList.remove("wiggling");
  }

});

// ぷるぷる動作
function playWiggle() {

  monster.classList.remove("still");
  toggle.textContent = "動きを止める";

  monster.classList.remove("wiggling");

  void monster.offsetWidth;

  monster.classList.add("wiggling");

  clearTimeout(wiggleTimer);

  wiggleTimer = setTimeout(() => {
    monster.classList.remove("wiggling");
  }, 700);

}

wiggle.addEventListener("click", playWiggle);

</script>
</body>
</html>
