
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぬのモン - クリームの子</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #171717;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 20px;
}

.app {
  width: min(100%, 520px);
  text-align: center;
}

h1 {
  font-size: 1.35rem;
  margin: 0 0 6px;
}

.sub {
  color: #c9c9c9;
  font-size: .9rem;
  margin: 0 0 18px;
}

.stage {
  min-height: 390px;
  display: grid;
  place-items: center;
  background: radial-gradient(
    ellipse at center,
    #383838,
    #202020 70%
  );
  border: 1px solid #555;
  border-radius: 22px;
  overflow: hidden;
  padding: 22px;
}

.monster {
  position: relative;
  width: min(82vw, 360px);
  aspect-ratio: 921 / 936;
  animation: float 2.6s ease-in-out infinite;
  transform-origin: 50% 80%;
}

.monster.still {
  animation: none;
}

.part {
  position: absolute;
  height: auto;
  user-select: none;
  pointer-events: none;
}

.body {
  inset: 0;
  width: 100%;
}

.eye {
  width: 25.5%;
  top: 27%;
  transform-origin: center 55%;
  animation: blink 4.8s infinite;
}

.eye.left {
  left: 24%;
}

.eye.right {
  left: 55%;
  animation-delay: .12s;
}

.mouth {
  width: 36%;
  left: 35%;
  top: 54%;
  transform-origin: center 15%;
  animation: mouthMove 3.1s ease-in-out infinite;
}

/* 通常の表情 */
@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(0deg);
  }
  50% {
    transform: translateY(-9px) rotate(-1deg);
  }
}

@keyframes blink {
  0%, 43%, 47%, 100% {
    transform: scaleY(1);
  }
  45% {
    transform: scaleY(.12);
  }
}

@keyframes mouthMove {
  0%, 100% {
    transform: translateY(0) scaleY(1);
  }
  50% {
    transform: translateY(3px) scaleY(.94);
  }
}

/* びっくり顔 */
.monster.expression-surprised .eye {
  animation-name: blinkWide;
}

.monster.expression-surprised .mouth {
  animation-name: mouthSurprised;
}

@keyframes blinkWide {
  0%, 43%, 47%, 100% {
    transform: scaleY(1.2);
  }
  45% {
    transform: scaleY(.8);
  }
}

@keyframes mouthSurprised {
  0%, 100% {
    transform: translateY(-2px) scaleY(1.12);
  }
  50% {
    transform: translateY(1px) scaleY(1.2);
  }
}

/* にっこり顔 */
.monster.expression-happy .eye {
  animation-name: blinkHappy;
}

.monster.expression-happy .mouth {
  animation-name: mouthHappy;
}

@keyframes blinkHappy {
  0%, 43%, 47%, 100% {
    transform: scaleY(.65);
  }
  45% {
    transform: scaleY(.12);
  }
}

@keyframes mouthHappy {
  0%, 100% {
    transform: translateY(0) scaleY(1.08);
  }
  50% {
    transform: translateY(4px) scaleY(.9);
  }
}

/* 動きを止めたとき */
.monster.still .eye,
.monster.still .mouth {
  animation: none !important;
}

/* ぷるぷる */
.monster.wiggling {
  animation: wiggle .65s ease-in-out;
}

@keyframes wiggle {
  0%, 100% {
    transform: rotate(0);
  }
  20% {
    transform: rotate(-7deg);
  }
  40% {
    transform: rotate(7deg);
  }
  60% {
    transform: rotate(-5deg);
  }
  80% {
    transform: rotate(4deg);
  }
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 11px 18px;
  font-size: .95rem;
  font-weight: 650;
  cursor: pointer;
  background: #f4e9e1;
  color: #302722;
}

button.secondary {
  background: #454545;
  color: white;
  border: 1px solid #777;
}

button:active {
  transform: scale(.96);
}

.note {
  color: #bdbdbd;
  font-size: .8rem;
  margin-top: 15px;
  line-height: 1.6;
}
</style>
</head>

<body>

<main class="app">

  <h1>ぬのモン</h1>
  <p class="sub">クリーム色の子・表情アニメーション試作</p>

  <section class="stage">

    <div class="monster" id="monster">

      <img class="part body" src="body.png" alt="">

      <img
        class="part eye left"
        src="eye_left.png"
        alt=""
      >

      <img
        class="part eye right"
        src="eye_right.png"
        alt=""
      >

      <img
        class="part mouth"
        src="mouth.png"
        alt=""
      >

    </div>

  </section>

  <div class="controls">

    <button id="toggle">
      動きを止める
    </button>

    <button class="secondary" id="wiggle">
      ぷるぷる！
    </button>

    <button class="secondary" id="expression">
      表情：いつもの顔
    </button>

  </div>

  <p class="note" id="note">
    表情を切り替えて遊んでみよう！
  </p>

</main>

<script>

const monster = document.getElementById("monster");
const toggle = document.getElementById("toggle");
const wiggle = document.getElementById("wiggle");
const expression = document.getElementById("expression");
const note = document.getElementById("note");

// 動きを止める・再開する
toggle.addEventListener("click", () => {

  monster.classList.toggle("still");

  const isStill = monster.classList.contains("still");

  toggle.textContent = isStill
    ? "動かす"
    : "動きを止める";

});

// ぷるぷる動かす
wiggle.addEventListener("click", () => {

  monster.classList.remove("still");
  toggle.textContent = "動きを止める";

  monster.classList.remove("wiggling");

  void monster.offsetWidth;

  monster.classList.add("wiggling");

  setTimeout(() => {
    monster.classList.remove("wiggling");
  }, 700);

});

// 表情を切り替える
const expressions = [
  {
    name: "いつもの顔",
    className: "",
    message: "いつもの顔だよ！"
  },
  {
    name: "びっくり",
    className: "expression-surprised",
    message: "びっくりした！"
  },
  {
    name: "にっこり",
    className: "expression-happy",
    message: "ごきげんだよ！"
  }
];

let currentExpression = 0;

expression.addEventListener("click", () => {

  currentExpression =
    (currentExpression + 1) % expressions.length;

  monster.classList.remove(
    "expression-surprised",
    "expression-happy"
  );

  const selected = expressions[currentExpression];

  if (selected.className) {
    monster.classList.add(selected.className);
  }

  expression.textContent =
    "表情：" + selected.name;

  note.textContent = selected.message;

});

</script>

</body>
</html>
