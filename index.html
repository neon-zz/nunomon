
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぬのモン - 輪郭認識試作</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #171717;
  color: white;
  font-family: system-ui, sans-serif;
  padding: 16px;
}
.app { width: min(100%, 520px); text-align: center; }
h1 { font-size: 1.5rem; margin-bottom: 5px; }
.sub { color: #bbb; margin-bottom: 20px; }

.stage {
  min-height: 360px;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, #383838, #202020 70%);
  border: 1px solid #555;
  border-radius: 22px;
  overflow: hidden;
  padding: 18px;
}
.monster {
  position: relative;
  width: min(82vw, 340px);
  aspect-ratio: 921 / 936;
  animation: float 2.6s ease-in-out infinite;
  transform-origin: 50% 80%;
}
.monster.still { animation: none; }
.part {
  position: absolute;
  height: auto;
  user-select: none;
  pointer-events: none;
}
.body { inset: 0; width: 100%; }
.eye {
  width: 25.5%;
  top: 27%;
  transform-origin: center 55%;
  animation: blink 4.8s infinite;
}
.eye.left { left: 24%; }
.eye.right { left: 55%; animation-delay: .12s; }
.mouth {
  width: 36%;
  left: 35%;
  top: 54%;
  transform-origin: center 15%;
  animation: mouthMove 3.1s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-9px) rotate(-1deg); }
}
@keyframes blink {
  0%,43%,47%,100% { transform: scaleY(1); }
  45% { transform: scaleY(.12); }
}
@keyframes mouthMove {
  0%,100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(3px) scaleY(.94); }
}
.expression-surprised .eye { animation-name: surprisedEyes; }
.expression-surprised .mouth { animation-name: surprisedMouth; }
@keyframes surprisedEyes {
  0%,100% { transform: scaleY(1.2); }
  45% { transform: scaleY(.8); }
}
@keyframes surprisedMouth {
  0%,100% { transform: scaleY(1.12); }
  50% { transform: scaleY(1.2); }
}
.expression-happy .eye { animation-name: happyEyes; }
.expression-happy .mouth { animation-name: happyMouth; }
@keyframes happyEyes {
  0%,100% { transform: scaleY(.65); }
  45% { transform: scaleY(.12); }
}
@keyframes happyMouth {
  0%,100% { transform: scaleY(1.08); }
  50% { transform: translateY(4px) scaleY(.9); }
}
.expression-sleepy .eye { animation-name: sleepyEyes; }
.expression-sleepy .mouth { animation-name: sleepyMouth; }
@keyframes sleepyEyes {
  0%,100% { transform: scaleY(.35); }
  50% { transform: scaleY(.25); }
}
@keyframes sleepyMouth {
  0%,100% { transform: scaleY(.8); }
  50% { transform: translateY(3px) scaleY(.7); }
}
.expression-sad .eye { animation-name: sadEyes; }
.expression-sad .mouth { animation-name: sadMouth; }
@keyframes sadEyes {
  0%,100% { transform: translateY(3px) scaleY(.8); }
  50% { transform: translateY(5px) scaleY(.7); }
}
@keyframes sadMouth {
  0%,100% { transform: translateY(5px) scaleY(.7); }
  50% { transform: translateY(7px) scaleY(.65); }
}
.monster.still .eye,
.monster.still .mouth { animation: none !important; }
.monster.wiggling { animation: wiggle .65s ease-in-out; }
@keyframes wiggle {
  0%,100% { transform: rotate(0); }
  20% { transform: rotate(-7deg); }
  40% { transform: rotate(7deg); }
  60% { transform: rotate(-5deg); }
  80% { transform: rotate(4deg); }
}

/* 感情演出 */
.effect-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}
.effect {
  position: absolute;
  display: block;
  font-weight: 900;
  line-height: 1;
  opacity: 0;
  user-select: none;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.35));
}
.effect.show { animation: effectPop 1.45s ease-out both; }
@keyframes effectPop {
  0% { opacity: 0; transform: translateY(12px) scale(.35) rotate(-12deg); }
  18% { opacity: 1; transform: translateY(-3px) scale(1.18) rotate(8deg); }
  38% { opacity: 1; transform: translateY(-7px) scale(1) rotate(-5deg); }
  100% { opacity: 0; transform: translateY(-34px) scale(.8) rotate(10deg); }
}
.effect-surprise {
  top: 3%; right: 2%;
  font-size: clamp(34px, 10vw, 48px);
  color: #ffe16b;
}
.effect-happy-left { top: 25%; left: -4%; font-size: 37px; color: #ffe66d; }
.effect-happy-right { top: 18%; right: -5%; font-size: 42px; color: #a9eaff; }
.effect-sleepy { top: 0%; right: 1%; font-size: 38px; color: #b9c7ff; }
.effect-sad { top: 34%; left: 5%; font-size: 42px; color: #80d8ff; }
.effect-normal { top: 5%; left: 4%; font-size: 26px; color: #f5d6ad; }

/* カメラ・撮影 */
.camera-panel {
  margin-top: 20px;
  padding: 15px;
  background: #292929;
  border: 1px solid #555;
  border-radius: 18px;
}
.camera-panel h2 { font-size: 1.15rem; margin: 0 0 8px; }
.camera-help {
  color: #bbb;
  font-size: .83rem;
  line-height: 1.55;
}
.camera-view {
  width: 100%;
  aspect-ratio: 4 / 3;
  min-height: 210px;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #555;
}
.camera-view video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.camera-placeholder { color: #999; padding: 18px; }

.photo-area {
  position: relative;
  width: 100%;
  margin-top: 12px;
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  line-height: 0;
  touch-action: manipulation;
}
.photo-area img {
  display: block;
  width: 100%;
  height: auto;
}
.photo-area canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.camera-buttons, .controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 12px;
}
button {
  border: 0;
  border-radius: 999px;
  padding: 11px 15px;
  font-size: .9rem;
  font-weight: 650;
  cursor: pointer;
  background: #f4e9e1;
  color: #302722;
}
button.secondary {
  background: #454545;
  color: white;
  border: 1px solid #777;
}
button.active { background: #d9b7ff; color: #30203f; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:active { transform: scale(.96); }
.note, .camera-status {
  color: #bbb;
  font-size: .85rem;
  line-height: 1.6;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
.camera-status { color: #d8c4ff; }

.recognition-result {
  color: #a9edb5;
  font-size: .9rem;
  line-height: 1.5;
  margin-top: 10px;
}
.recognition-hint {
  color: #ffe19a;
  font-size: .83rem;
  line-height: 1.5;
}
@media (max-width: 600px) {
  body { padding: 12px; }
  .stage { min-height: 310px; padding: 12px; }
  .monster { width: min(78vw, 320px); }
  .camera-panel { padding: 12px; }
  button { padding: 10px 12px; }
}
</style>
</head>

<body>
<main class="app">
<h1>ぬのモン</h1>
<p class="sub">クリーム色の子・輪郭認識試作</p>

<section class="stage">
  <div class="monster" id="monster">
    <img class="part body" src="body.png" alt="">
    <img class="part eye left" src="eye_left.png" alt="">
    <img class="part eye right" src="eye_right.png" alt="">
    <img class="part mouth" src="mouth.png" alt="">
    <div class="effect-layer" id="effectLayer"></div>
  </div>
</section>

<section class="camera-panel">
  <h2>📷 フェルトのモンスターを撮影</h2>
  <p class="camera-help">
    モンスターを背景の上に置いて撮影してね。
  </p>

  <div class="camera-view" id="cameraView">
    <div class="camera-placeholder" id="cameraPlaceholder">
      「カメラを起動」を押してね
    </div>
    <video id="cameraVideo" autoplay muted playsinline hidden></video>
  </div>

  <div class="camera-buttons">
    <button id="startCamera">カメラを起動</button>
    <button id="takePhoto" disabled>撮影する</button>
    <button id="retakePhoto" class="secondary" hidden>撮り直す</button>
    <button id="stopCamera" class="secondary" disabled>カメラを終了</button>
  </div>

  <p class="camera-status" id="cameraStatus">
    カメラはまだ起動していないよ。
  </p>

  <div class="photo-area" id="photoArea" hidden>
    <img id="capturedImage" alt="撮影したフェルトモンスター">
    <canvas id="outlineCanvas"></canvas>
  </div>

  <p class="recognition-hint" id="recognitionHint" hidden>
    写真の中のモンスター以外の背景をタップしてね。
  </p>

  <div class="camera-buttons">
    <button id="recognizeButton" disabled>輪郭を認識する</button>
    <button id="clearOutline" class="secondary" hidden>輪郭を消す</button>
  </div>

  <p class="recognition-result" id="recognitionResult"></p>
  <canvas id="photoCanvas" hidden></canvas>
</section>

<div class="controls" id="expressions">
  <button class="active" data-expression="normal">😊 いつもの顔</button>
  <button data-expression="surprised">😲 びっくり</button>
  <button data-expression="happy">😄 にっこり</button>
  <button data-expression="sleepy">😴 ねむい</button>
  <button data-expression="sad">🥺 しょんぼり</button>
</div>

<div class="controls">
  <button id="auto">おまかせ OFF</button>
  <button id="toggle">動きを止める</button>
  <button class="secondary" id="wiggle">ぷるぷる！</button>
</div>
<p class="note" id="note">好きな表情を選んでみよう！</p>
</main>

<script>
// 表情とアニメーション
const monster = document.getElementById("monster");
const toggle = document.getElementById("toggle");
const wiggle = document.getElementById("wiggle");
const autoButton = document.getElementById("auto");
const note = document.getElementById("note");
const effectLayer = document.getElementById("effectLayer");
const buttons = document.querySelectorAll("[data-expression]");

const expressions = {
  normal: {
    message: "いつもの顔だよ！",
    effects: [{ text: "ぷるん", className: "effect-normal" }]
  },
  surprised: {
    message: "びっくりした！",
    effects: [
      { text: "!?", className: "effect-surprise" },
      { text: "ぴょこっ", className: "effect-normal" }
    ]
  },
  happy: {
    message: "ごきげんだよ！",
    effects: [
      { text: "✦", className: "effect-happy-left" },
      { text: "✧", className: "effect-happy-right" },
      { text: "キラキラ", className: "effect-normal" }
    ]
  },
  sleepy: {
    message: "もう眠たいなぁ……",
    effects: [{ text: "Zzz", className: "effect-sleepy" }]
  },
  sad: {
    message: "ちょっと元気がないみたい……",
    effects: [
      { text: "💧", className: "effect-sad" },
      { text: "しくしく", className: "effect-normal" }
    ]
  }
};

const expressionNames = Object.keys(expressions);
let autoMode = false;
let autoTimer = null;
let wiggleTimer = null;
let effectTimer = null;

function showEffects(name) {
  clearTimeout(effectTimer);
  effectLayer.innerHTML = "";
  expressions[name].effects.forEach(item => {
    const element = document.createElement("span");
    element.className = "effect " + item.className;
    element.textContent = item.text;
    effectLayer.appendChild(element);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => element.classList.add("show"));
    });
  });
  effectTimer = setTimeout(() => effectLayer.innerHTML = "", 1650);
}

function changeExpression(name) {
  monster.classList.remove(
    "expression-surprised", "expression-happy",
    "expression-sleepy", "expression-sad"
  );
  if (name !== "normal") monster.classList.add("expression-" + name);
  buttons.forEach(button => {
    button.classList.toggle("active", button.dataset.expression === name);
  });
  note.textContent = expressions[name].message;
  showEffects(name);
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    stopAuto();
    changeExpression(button.dataset.expression);
  });
});

function startAuto() {
  if (autoMode) return;
  autoMode = true;
  autoButton.textContent = "おまかせ ON";
  autoButton.classList.add("active");
  note.textContent = "自由気ままに遊んでいるよ！";
  scheduleAction();
}
function stopAuto() {
  autoMode = false;
  clearTimeout(autoTimer);
  clearTimeout(wiggleTimer);
  monster.classList.remove("wiggling");
  autoButton.textContent = "おまかせ OFF";
  autoButton.classList.remove("active");
}
function scheduleAction() {
  clearTimeout(autoTimer);
  if (!autoMode) return;
  autoTimer = setTimeout(() => {
    if (!autoMode) return;
    const selected = expressionNames[
      Math.floor(Math.random() * expressionNames.length)
    ];
    changeExpression(selected);
    if (Math.random() < .25) playWiggle();
    scheduleAction();
  }, 3000 + Math.random() * 3000);
}
autoButton.addEventListener("click", () => {
  if (autoMode) {
    stopAuto();
    note.textContent = "おまかせを終了したよ！";
  } else {
    startAuto();
  }
});
toggle.addEventListener("click", () => {
  const stopped = monster.classList.toggle("still");
  toggle.textContent = stopped ? "動かす" : "動きを止める";
  if (stopped) monster.classList.remove("wiggling");
});
function playWiggle() {
  monster.classList.remove("still");
  toggle.textContent = "動きを止める";
  monster.classList.remove("wiggling");
  void monster.offsetWidth;
  monster.classList.add("wiggling");
  clearTimeout(wiggleTimer);
  wiggleTimer = setTimeout(() => monster.classList.remove("wiggling"), 700);
}
wiggle.addEventListener("click", playWiggle);


// カメラ機能
const cameraVideo = document.getElementById("cameraVideo");
const cameraPlaceholder = document.getElementById("cameraPlaceholder");
const capturedImage = document.getElementById("capturedImage");
const photoCanvas = document.getElementById("photoCanvas");
const outlineCanvas = document.getElementById("outlineCanvas");
const photoArea = document.getElementById("photoArea");
const startCameraButton = document.getElementById("startCamera");
const takePhotoButton = document.getElementById("takePhoto");
const retakePhotoButton = document.getElementById("retakePhoto");
const stopCameraButton = document.getElementById("stopCamera");
const cameraStatus = document.getElementById("cameraStatus");
const recognizeButton = document.getElementById("recognizeButton");
const clearOutlineButton = document.getElementById("clearOutline");
const recognitionHint = document.getElementById("recognitionHint");
const recognitionResult = document.getElementById("recognitionResult");

let cameraStream = null;
let selectedBackground = null;

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraStatus.textContent = "カメラを使えない環境だよ。HTTPSのSafariかChromeで開いてね。";
    return;
  }

  startCameraButton.disabled = true;
  cameraStatus.textContent = "カメラを起動中……";

  try {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        }
      });
    } catch (error) {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: true
      });
    }

    cameraStream = stream;
    cameraVideo.srcObject = stream;
    cameraVideo.muted = true;
    cameraVideo.setAttribute("playsinline", "");
    cameraVideo.hidden = false;
    cameraPlaceholder.hidden = true;

    await new Promise((resolve, reject) => {
      if (cameraVideo.readyState >= 1 && cameraVideo.videoWidth > 0) {
        resolve();
        return;
      }
      const timeout = setTimeout(() => reject(new Error("映像準備タイムアウト")), 10000);
      cameraVideo.onloadedmetadata = () => {
        clearTimeout(timeout);
        resolve();
      };
      cameraVideo.onerror = () => {
        clearTimeout(timeout);
        reject(new Error("映像読み込みエラー"));
      };
    });

    await cameraVideo.play();
    takePhotoButton.disabled = false;
    stopCameraButton.disabled = false;
    retakePhotoButton.hidden = true;
    cameraStatus.textContent = "カメラが起動したよ！フェルトを映してね。";

  } catch (error) {
    stopCameraTracks();
    cameraVideo.srcObject = null;
    cameraVideo.hidden = true;
    cameraPlaceholder.hidden = false;
    startCameraButton.disabled = false;
    takePhotoButton.disabled = true;
    stopCameraButton.disabled = true;
    cameraStatus.textContent = "カメラを起動できなかったよ。Safariの許可を確認してね。";
    console.error(error);
  }
}

function stopCameraTracks() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
}

function resetRecognition() {
  selectedBackground = null;
  const ctx = outlineCanvas.getContext("2d");
  ctx.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
  recognizeButton.disabled = true;
  clearOutlineButton.hidden = true;
  recognitionHint.hidden = true;
  recognitionResult.textContent = "";
}

function takePhoto() {
  if (!cameraStream || !cameraVideo.videoWidth) {
    cameraStatus.textContent = "先にカメラを起動してね。";
    return;
  }

  photoCanvas.width = cameraVideo.videoWidth;
  photoCanvas.height = cameraVideo.videoHeight;

  const ctx = photoCanvas.getContext("2d");
  ctx.drawImage(cameraVideo, 0, 0, photoCanvas.width, photoCanvas.height);

  capturedImage.onload = () => {
    stopCameraTracks();
    cameraVideo.pause();
    cameraVideo.srcObject = null;
    cameraVideo.hidden = true;

    photoArea.hidden = false;
    cameraVideo.hidden = true;
    cameraPlaceholder.hidden = true;

    outlineCanvas.width = capturedImage.naturalWidth;
    outlineCanvas.height = capturedImage.naturalHeight;
    outlineCanvas.style.width = "100%";
    outlineCanvas.style.height = "100%";

    takePhotoButton.disabled = true;
    retakePhotoButton.hidden = false;
    startCameraButton.disabled = false;
    stopCameraButton.disabled = true;

    recognitionHint.hidden = false;
    recognizeButton.disabled = false;
    cameraStatus.textContent = "写真を撮影したよ！背景をタップしてね。";
    recognitionResult.textContent = "";
  };

  capturedImage.src = photoCanvas.toDataURL("image/jpeg", .92);
}

async function retakePhoto() {
  photoArea.hidden = true;
  resetRecognition();
  retakePhotoButton.hidden = true;
  cameraStatus.textContent = "カメラをもう一度起動するね。";
  await startCamera();
}

function stopCamera() {
  stopCameraTracks();
  cameraVideo.pause();
  cameraVideo.srcObject = null;
  cameraVideo.hidden = true;
  cameraPlaceholder.hidden = false;
  photoArea.hidden = true;
  resetRecognition();

  startCameraButton.disabled = false;
  takePhotoButton.disabled = true;
  retakePhotoButton.hidden = true;
  stopCameraButton.disabled = true;
  cameraStatus.textContent = "カメラを終了したよ。";
}

// 写真のタップ位置を元画像のピクセル位置に変換
function getImagePoint(event) {
  const rect = capturedImage.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;

  if (x < 0 || x > 1 || y < 0 || y > 1) return null;

  return {
    x: Math.floor(x * capturedImage.naturalWidth),
    y: Math.floor(y * capturedImage.naturalHeight)
  };
}

// 背景色をタップして指定する
capturedImage.addEventListener("click", event => {
  if (photoArea.hidden) return;

  const point = getImagePoint(event);
  if (!point) return;

  selectedBackground = point;
  recognizeButton.disabled = false;
  recognitionResult.textContent =
    "背景の場所を指定したよ。『輪郭を認識する』を押してね。";

  const ctx = outlineCanvas.getContext("2d");
  ctx.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);

  // 選んだ点に小さな印を表示
  ctx.beginPath();
  ctx.arc(point.x, point.y, Math.max(8, capturedImage.naturalWidth / 100), 0, Math.PI * 2);
  ctx.strokeStyle = "#ffdf57";
  ctx.lineWidth = Math.max(3, capturedImage.naturalWidth / 250);
  ctx.stroke();
});

// 背景と似た色で、タップ地点からつながっている範囲を探す
function recognizeOutline() {
  if (!selectedBackground) {
    recognitionResult.textContent = "まず写真の背景をタップしてね。";
    return;
  }

  const width = capturedImage.naturalWidth;
  const height = capturedImage.naturalHeight;

  // 処理を軽くするため、最大幅480pxに縮小して認識
  const scale = Math.min(1, 480 / width);
  const w = Math.max(1, Math.round(width * scale));
  const h = Math.max(1, Math.round(height * scale));

  const workCanvas = document.createElement("canvas");
  workCanvas.width = w;
  workCanvas.height = h;

  const workCtx = workCanvas.getContext("2d", { willReadFrequently: true });
  workCtx.drawImage(capturedImage, 0, 0, w, h);

  const imageData = workCtx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const total = w * h;

  const startX = Math.min(w - 1, Math.max(0, Math.floor(selectedBackground.x * scale)));
  const startY = Math.min(h - 1, Math.max(0, Math.floor(selectedBackground.y * scale)));
  const startIndex = (startY * w + startX) * 4;

  const bgR = data[startIndex];
  const bgG = data[startIndex + 1];
  const bgB = data[startIndex + 2];

  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);
  let head = 0;
  let tail = 0;

  const startPixel = startY * w + startX;
  queue[tail++] = startPixel;
  visited[startPixel] = 1;

  // 色の許容範囲。背景に影がある場合は調整が必要。
  const tolerance = 52;
  const toleranceSquared = tolerance * tolerance * 3;

  function isBackground(pixel) {
    const i = pixel * 4;
    const dr = data[i] - bgR;
    const dg = data[i + 1] - bgG;
    const db = data[i + 2] - bgB;
    return dr * dr + dg * dg + db * db <= toleranceSquared;
  }

  while (head < tail) {
    const pixel = queue[head++];
    const x = pixel % w;
    const y = Math.floor(pixel / w);

    const neighbors = [];
    if (x > 0) neighbors.push(pixel - 1);
    if (x < w - 1) neighbors.push(pixel + 1);
    if (y > 0) neighbors.push(pixel - w);
    if (y < h - 1) neighbors.push(pixel + w);

    for (const next of neighbors) {
      if (!visited[next] && isBackground(next)) {
        visited[next] = 1;
        queue[tail++] = next;
      }
    }
  }

  // 背景以外の最大の連結領域を探す
  const foregroundVisited = new Uint8Array(total);
  let largestComponent = [];
  let minX = w, minY = h, maxX = 0, maxY = 0;

  for (let i = 0; i < total; i++) {
    if (visited[i] || foregroundVisited[i]) continue;

    const component = [];
    const stack = [i];
    foregroundVisited[i] = 1;

    let cMinX = w, cMinY = h, cMaxX = 0, cMaxY = 0;

    while (stack.length) {
      const pixel = stack.pop();
      component.push(pixel);

      const x = pixel % w;
      const y = Math.floor(pixel / w);
      cMinX = Math.min(cMinX, x);
      cMinY = Math.min(cMinY, y);
      cMaxX = Math.max(cMaxX, x);
      cMaxY = Math.max(cMaxY, y);

      const neighbors = [];
      if (x > 0) neighbors.push(pixel - 1);
      if (x < w - 1) neighbors.push(pixel + 1);
      if (y > 0) neighbors.push(pixel - w);
      if (y < h - 1) neighbors.push(pixel + w);

      for (const next of neighbors) {
        if (!visited[next] && !foregroundVisited[next]) {
          foregroundVisited[next] = 1;
          stack.push(next);
        }
      }
    }

    if (component.length > largestComponent.length) {
      largestComponent = component;
      minX = cMinX;
      minY = cMinY;
      maxX = cMaxX;
      maxY = cMaxY;
    }
  }

  if (largestComponent.length < total * 0.002) {
    recognitionResult.textContent =
      "モンスターを見つけられなかったよ。背景を別の場所でタップしてみてね。";
    return;
  }

  // 元画像サイズの透明キャンバスに輪郭を描く
  const output = document.createElement("canvas");
  output.width = width;
  output.height = height;
  const outCtx = output.getContext("2d");
  const outlineData = outCtx.createImageData(width, height);

  const foregroundMask = new Uint8Array(total);
  largestComponent.forEach(pixel => foregroundMask[pixel] = 1);

  // 背景との境界に緑色の線を描く
  for (const pixel of largestComponent) {
    const x = pixel % w;
    const y = Math.floor(pixel / w);

    const edge =
      x === 0 || y === 0 || x === w - 1 || y === h - 1 ||
      !foregroundMask[pixel - 1] ||
      !foregroundMask[pixel + 1] ||
      !foregroundMask[pixel - w] ||
      !foregroundMask[pixel + w];

    if (!edge) continue;

    const originalX = Math.floor(x / scale);
    const originalY = Math.floor(y / scale);
    const radius = Math.max(1, Math.round(2 / scale));

    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const px = originalX + dx;
        const py = originalY + dy;

        if (px < 0 || py < 0 || px >= width || py >= height) continue;

        const index = (py * width + px) * 4;
        outlineData.data[index] = 65;
        outlineData.data[index + 1] = 255;
        outlineData.data[index + 2] = 130;
        outlineData.data[index + 3] = 255;
      }
    }
  }

  outCtx.putImageData(outlineData, 0, 0);

  // 輪郭と外接枠を重ねる
  const displayCtx = outlineCanvas.getContext("2d");
  displayCtx.clearRect(0, 0, width, height);
  displayCtx.drawImage(output, 0, 0);

  const originalMinX = minX / scale;
  const originalMinY = minY / scale;
  const originalMaxX = maxX / scale;
  const originalMaxY = maxY / scale;

  displayCtx.strokeStyle = "#ffe05a";
  displayCtx.lineWidth = Math.max(3, width / 180);
  displayCtx.strokeRect(
    originalMinX,
    originalMinY,
    originalMaxX - originalMinX,
    originalMaxY - originalMinY
  );

  clearOutlineButton.hidden = false;
  recognitionResult.textContent =
    "輪郭を見つけたよ！緑色が輪郭、黄色が全体の範囲だよ。";
}

function clearOutline() {
  const ctx = outlineCanvas.getContext("2d");
  ctx.clearRect(0, 0, outlineCanvas.width, outlineCanvas.height);
  recognitionResult.textContent = "";
  clearOutlineButton.hidden = true;
  recognitionHint.hidden = false;
}

recognizeButton.addEventListener("click", recognizeOutline);
clearOutlineButton.addEventListener("click", clearOutline);

startCameraButton.addEventListener("click", startCamera);
takePhotoButton.addEventListener("click", takePhoto);
retakePhotoButton.addEventListener("click", retakePhoto);
stopCameraButton.addEventListener("click", stopCamera);

window.addEventListener("pagehide", stopCamera);

showEffects("normal");
</script>
</body>
</html>
