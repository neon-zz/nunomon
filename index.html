<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぬのモン - クリームの子</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #171717; color: #fff; font-family: system-ui, sans-serif;
    padding: 20px;
  }
  .app { width: min(100%, 520px); text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .sub { color: #c9c9c9; font-size: .9rem; margin: 0 0 18px; }
  .stage {
    min-height: 390px; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #383838, #202020 70%);
    border: 1px solid #555; border-radius: 22px; overflow: hidden;
    padding: 22px;
  }
  .monster {
    position: relative; width: min(82vw, 360px); aspect-ratio: 921 / 936;
    animation: float 2.6s ease-in-out infinite;
    transform-origin: 50% 80%;
  }
  .monster.still { animation: none; }
  .part { position: absolute; height: auto; user-select: none; pointer-events: none; }
  .body { inset: 0; width: 100%; }
  .eye {
    width: 25.5%; top: 27%; transform-origin: center 55%;
    animation: blink 4.8s infinite;
  }
  .eye.left { left: 24%; }
  .eye.right { left: 55%; animation-delay: .12s; }
  .mouth {
    width: 36%; left: 35%; top: 54%;
    transform-origin: center 15%;
    animation: mouthMove 3.1s ease-in-out infinite;
  }
  .monster.still .eye, .monster.still .mouth { animation: none; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-9px) rotate(-1deg); }
  }
  @keyframes blink {
    0%, 43%, 47%, 100% { transform: scaleY(1); }
    45% { transform: scaleY(.12); }
  }
  @keyframes mouthMove {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(3px) scaleY(.94); }
  }
  .controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  button {
    border: 0; border-radius: 999px; padding: 11px 18px;
    font-size: .95rem; font-weight: 650; cursor: pointer;
    background: #f4e9e1; color: #302722;
  }
  button.secondary { background: #454545; color: white; border: 1px solid #777; }
  .note { color: #bdbdbd; font-size: .8rem; margin-top: 15px; line-height: 1.6; }
</style>
</head>
<body>
<main class="app">
  <h1>ぬのモン</h1>
  <p class="sub">クリーム色の子・アニメーション試作</p>
  <section class="stage" aria-label="モンスター表示エリア">
    <div class="monster" id="monster">
      <img class="part body" src="body.png" alt="">
      <img class="part eye left" src="eye_left.png" alt="">
      <img class="part eye right" src="eye_right.png" alt="">
      <img class="part mouth" src="mouth.png" alt="">
    </div>
  </section>
  <div class="controls">
    <button id="toggle">動きを止める</button>
    <button class="secondary" id="wiggle">ぷるぷる！</button>
  </div>
  <p class="note">体・左右の目・口を別々の画像として重ねています。<br>いまは表示と簡単な動きの確認用。カメラ認識との合体は次の段階です。</p>
</main>
<script>
const monster = document.getElementById('monster');
const toggle = document.getElementById('toggle');
const wiggle = document.getElementById('wiggle');
toggle.addEventListener('click', () => {
  monster.classList.toggle('still');
  toggle.textContent = monster.classList.contains('still') ? '動かす' : '動きを止める';
});
wiggle.addEventListener('click', () => {
  monster.classList.remove('still');
  monster.style.animation = 'none';
  void monster.offsetWidth;
  monster.style.animation = 'wiggle .65s ease-in-out';
  setTimeout(() => { monster.style.animation = ''; }, 700);
});
const style = document.createElement('style');
style.textContent = '@keyframes wiggle { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-7deg)} 40%{transform:rotate(7deg)} 60%{transform:rotate(-5deg)} 80%{transform:rotate(4deg)} }';
document.head.appendChild(style);
</script>
</body>
</html>
